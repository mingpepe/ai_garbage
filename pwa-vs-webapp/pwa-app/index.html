<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progressive Web App (PWA 概念驗證)</title>
  
  <!-- Web App Manifest -->
  <link rel="manifest" href="manifest.json">
  <!-- Theme Color for Browser Tab & Status Bar -->
  <meta name="theme-color" content="#06b6d4">
  
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="main-layout">
    <!-- Left Column: Notes Application Shell -->
    <div class="app-container">
      <header>
        <h1>
          📱 PWA Notes App
        </h1>
        <div class="badge-group">
          <!-- Connection Status -->
          <div id="connection-status" class="status-badge status-online">
            <span class="dot"></span>
            <span class="status-text">Online</span>
          </div>
          <!-- Window/App display mode status -->
          <div id="display-mode-badge" class="status-badge mode-badge">
            <span class="status-text">瀏覽器分頁</span>
          </div>
        </div>
      </header>

      <!-- Sync Status -->
      <div class="sync-panel">
        <span>模擬雲端資料庫同步:</span>
        <span id="sync-status" class="sync-status sync-success">已同步</span>
      </div>

      <!-- Note Input Form -->
      <form id="note-form" class="note-form">
        <input type="text" id="note-input" class="note-input" placeholder="新增一項筆記 (支援離線儲存)..." required autocomplete="off">
        <button type="submit" class="btn-add">新增</button>
      </form>

      <!-- Notes list -->
      <ul id="notes-list" class="notes-list">
        <!-- Dynmically loaded notes -->
      </ul>
    </div>

    <!-- Right Column: PWA Management Console & Install Banner -->
    <div class="pwa-controls">
      <!-- Installation Prompt Card -->
      <div class="pwa-card" id="installation-card">
        <h2>✨ PWA 安裝管理</h2>
        <p id="install-desc">載入中... 正在檢查是否能安裝此網頁為桌面應用程式。</p>
        
        <div id="install-banner" class="install-banner">
          <p style="color: #4ade80; margin-bottom: 0.5rem; font-weight: 600;">🎉 偵測到可安裝！</p>
          <button id="btn-install" class="btn-install">安裝 PWA 應用程式</button>
        </div>
      </div>

      <!-- Live Service Worker Log Monitor -->
      <div class="pwa-card">
        <h2>📟 PWA 即時背景日誌 (Service Worker)</h2>
        <p>顯示 Service Worker 的背景生命週期與網路請求攔截狀態。</p>
        <div id="console-box" class="console-box">
          <div class="console-line log-info">[系統] 正在等待註冊 Service Worker...</div>
        </div>
      </div>
    </div>

    <!-- Back Navigation Link -->
    <div class="footer-nav">
      <a href="../index.html">← 返回 PWA 比較儀表板</a>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
