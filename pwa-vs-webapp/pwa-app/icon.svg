<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <rect width="512" height="512" rx="128" fill="#151d30" />
  <circle cx="256" cy="256" r="200" fill="url(#grad)" opacity="0.15" />
  
  <!-- Clipboard/Note outline -->
  <rect x="146" y="116" width="220" height="280" rx="20" fill="none" stroke="url(#grad)" stroke-width="24" stroke-linejoin="round" />
  
  <!-- Lines on the paper -->
  <line x1="196" y1="200" x2="316" y2="200" stroke="url(#grad)" stroke-width="20" stroke-linecap="round" />
  <line x1="196" y1="260" x2="316" y2="260" stroke="url(#grad)" stroke-width="20" stroke-linecap="round" />
  <line x1="196" y1="320" x2="276" y2="320" stroke="url(#grad)" stroke-width="20" stroke-linecap="round" />
  
  <!-- Checkmark decoration -->
  <path d="M 330 330 L 360 360 L 420 290" fill="none" stroke="#10b981" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
</svg>
