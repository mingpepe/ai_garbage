<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" width="1120" height="760" font-family="Consolas, 'Segoe UI', monospace">
  <defs>
    <!-- Arrowheads -->
    <marker id="arrow-dep" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B" />
    </marker>
    <marker id="arrow-own" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8" />
    </marker>
    <marker id="arrow-impl" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#0F172A" stroke="#34D399" stroke-width="1.5" />
    </marker>
    <marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F59E0B" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1120" height="760" fill="#0B1120" rx="8" />

  <!-- Title -->
  <text x="28" y="36" fill="#F8FAFC" font-size="18" font-weight="bold">I3CEmulator.Core — Architecture &amp; Class Dependencies</text>
  <text x="28" y="54" fill="#94A3B8" font-size="11">Layers: Simulation → Devices → Physical → Protocol</text>

  <!-- Legend -->
  <g transform="translate(650, 18)">
    <rect width="442" height="40" rx="6" fill="#111827" stroke="#1E293B" />
    <line x1="14" y1="20" x2="42" y2="20" stroke="#38BDF8" stroke-width="1.8" marker-end="url(#arrow-own)" />
    <text x="50" y="24" fill="#CBD5E1" font-size="10.5">Owns / Drives</text>

    <line x1="142" y1="20" x2="170" y2="20" stroke="#34D399" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arrow-impl)" />
    <text x="178" y="24" fill="#CBD5E1" font-size="10.5">Implements</text>

    <line x1="258" y1="20" x2="286" y2="20" stroke="#F59E0B" stroke-width="1.8" marker-end="url(#arrow-data)" />
    <text x="294" y="24" fill="#CBD5E1" font-size="10.5">Events / Samples</text>

    <line x1="398" y1="20" x2="420" y2="20" stroke="#64748B" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow-dep)" />
    <text x="424" y="24" fill="#CBD5E1" font-size="10.5"></text>
  </g>
  <text x="1055" y="42" fill="#94A3B8" font-size="10" text-anchor="end">Uses</text>

  <!-- ==================== LAYER 1: SIMULATION ==================== -->
  <rect x="24" y="72" width="1072" height="148" rx="8" fill="#0F172A" stroke="#1D4ED8" stroke-width="1.2" />
  <text x="38" y="92" fill="#60A5FA" font-size="12" font-weight="bold">SIMULATION LAYER  (I3CEmulator.Core / Simulation)</text>

  <!-- I3CSimulationScenario -->
  <g transform="translate(44, 108)">
    <rect width="310" height="94" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1.6" />
    <rect width="310" height="24" rx="6" fill="#0369A1" />
    <text x="10" y="16" fill="#F8FAFC" font-size="12" font-weight="bold">I3CSimulationScenario</text>
    <text x="10" y="42" fill="#E2E8F0" font-size="10.5">• Orchestrates Ch 0..10 &amp; interactive ops</text>
    <text x="10" y="58" fill="#94A3B8" font-size="10">• Owns Bus, Master, TargetA..D, LegacyI2C</text>
    <text x="10" y="74" fill="#94A3B8" font-size="10">• Owns Recorder &amp; optional StepGate</text>
    <text x="10" y="88" fill="#7DD3FC" font-size="9.5">RunChapter(), InteractiveQueueAndServiceIbi()</text>
  </g>

  <!-- SimulationStepGate -->
  <g transform="translate(404, 108)">
    <rect width="215" height="94" rx="6" fill="#1E293B" stroke="#3B82F6" stroke-width="1.3" />
    <rect width="215" height="24" rx="6" fill="#1E3A8A" />
    <text x="10" y="16" fill="#F8FAFC" font-size="12" font-weight="bold">SimulationStepGate</text>
    <text x="10" y="44" fill="#E2E8F0" font-size="10.5">• Step / Tx / Chapter pause</text>
    <text x="10" y="62" fill="#94A3B8" font-size="10">• Blocks worker thread for</text>
    <text x="10" y="76" fill="#94A3B8" font-size="10">  GUI single-stepping</text>
  </g>

  <!-- BusWaveformRecorder -->
  <g transform="translate(658, 108)">
    <rect width="205" height="94" rx="6" fill="#1E293B" stroke="#F59E0B" stroke-width="1.3" />
    <rect width="205" height="24" rx="6" fill="#78350F" />
    <text x="10" y="16" fill="#FEF3C7" font-size="12" font-weight="bold">BusWaveformRecorder</text>
    <text x="10" y="44" fill="#E2E8F0" font-size="10.5">• Records BusSample[]</text>
    <text x="10" y="60" fill="#94A3B8" font-size="10">• DeviceSampleSnapshot[]</text>
    <text x="10" y="76" fill="#94A3B8" font-size="10">• Chapter &amp; Packet spans</text>
  </g>

  <!-- I3CProtocolDecoder -->
  <g transform="translate(894, 108)">
    <rect width="184" height="94" rx="6" fill="#1E293B" stroke="#F59E0B" stroke-width="1.3" />
    <rect width="184" height="24" rx="6" fill="#78350F" />
    <text x="10" y="16" fill="#FEF3C7" font-size="12" font-weight="bold">I3CProtocolDecoder</text>
    <text x="10" y="44" fill="#E2E8F0" font-size="10.5">• Decodes BusSample</text>
    <text x="10" y="60" fill="#94A3B8" font-size="10">  stream → DecodedPacket</text>
    <text x="10" y="76" fill="#94A3B8" font-size="10">  (CCC, DAA, IBI, I2C)</text>
  </g>

  <!-- ==================== LAYER 2: DEVICES ==================== -->
  <rect x="24" y="242" width="1072" height="196" rx="8" fill="#0F172A" stroke="#059669" stroke-width="1.2" />
  <text x="38" y="262" fill="#34D399" font-size="12" font-weight="bold">DEVICES LAYER  (I3CEmulator.Core / Devices)</text>

  <!-- IBusDevice Interface -->
  <g transform="translate(415, 272)">
    <rect width="290" height="46" rx="6" fill="#064E3B" stroke="#34D399" stroke-width="1.5" stroke-dasharray="5,3" />
    <text x="145" y="18" fill="#A7F3D0" font-size="11" font-weight="bold" text-anchor="middle">«interface» IBusDevice</text>
    <text x="145" y="34" fill="#D1FAE5" font-size="9.8" text-anchor="middle">OnStart / OnStop / OnSclRising / OnSclFalling / OnIdle</text>
  </g>

  <!-- I3CMaster -->
  <g transform="translate(44, 336)">
    <rect width="340" height="88" rx="6" fill="#1E293B" stroke="#34D399" stroke-width="1.5" />
    <rect width="340" height="24" rx="6" fill="#065F46" />
    <text x="10" y="16" fill="#ECFDF5" font-size="12" font-weight="bold">I3CMaster  (partial class)</text>
    <text x="10" y="40" fill="#E2E8F0" font-size="10">• Bits.cs: SCL/SDA drive, Start/Sr/Stop, Parity</text>
    <text x="10" y="54" fill="#94A3B8" font-size="10">• Daa.cs: RSTDAA, SETDASA, ENTDAA</text>
    <text x="10" y="68" fill="#94A3B8" font-size="10">• Ccc.cs / Ibi.cs / Transfers.cs (SDR &amp; I2C)</text>
    <text x="10" y="81" fill="#6EE7B7" font-size="9.5">TargetTable (DAT), LegacyI2CTable</text>
  </g>

  <!-- I3CSlave -->
  <g transform="translate(414, 336)">
    <rect width="318" height="88" rx="6" fill="#1E293B" stroke="#34D399" stroke-width="1.5" />
    <rect width="318" height="24" rx="6" fill="#065F46" />
    <text x="10" y="16" fill="#ECFDF5" font-size="12" font-weight="bold">I3CSlave  (TargetA..D)</text>
    <text x="10" y="40" fill="#E2E8F0" font-size="10">• Full I3C Target FSM (DAA, CCC, SDR, IBI, HJ)</text>
    <text x="10" y="54" fill="#94A3B8" font-size="10">• DynamicAddress, StaticAddress7Bit, PID/BCR/DCR</text>
    <text x="10" y="68" fill="#94A3B8" font-size="10">• Dual-mode 50ns Spike Filter (disabled on 7E)</text>
    <text x="10" y="81" fill="#6EE7B7" font-size="9.5">Registers[256], EnabledEvents, IsConnectedToBus</text>
  </g>

  <!-- I2CSlave -->
  <g transform="translate(762, 336)">
    <rect width="314" height="88" rx="6" fill="#1E293B" stroke="#A78BFA" stroke-width="1.5" />
    <rect width="314" height="24" rx="6" fill="#4C1D95" />
    <text x="10" y="16" fill="#F5F3FF" font-size="12" font-weight="bold">I2CSlave  (Legacy 24C02)</text>
    <text x="10" y="40" fill="#E2E8F0" font-size="10">• Classic I2C 400kHz FSM (9th-bit ACK/NACK)</text>
    <text x="10" y="54" fill="#94A3B8" font-size="10">• Permanent 50ns Spike Filter (blocks 40ns I3C)</text>
    <text x="10" y="68" fill="#94A3B8" font-size="10">• StaticAddress7Bit (0x50), LVR</text>
    <text x="10" y="81" fill="#C4B5FD" font-size="9.5">Registers[256], FilteredOutI3CClockPulses</text>
  </g>

  <!-- ==================== LAYER 3: PHYSICAL ==================== -->
  <rect x="24" y="460" width="1072" height="126" rx="8" fill="#0F172A" stroke="#D97706" stroke-width="1.2" />
  <text x="38" y="480" fill="#FBBF24" font-size="12" font-weight="bold">PHYSICAL LAYER  (I3CEmulator.Core / Physical)</text>

  <!-- I3CBus -->
  <g transform="translate(44, 494)">
    <rect width="650" height="78" rx="6" fill="#1E293B" stroke="#F59E0B" stroke-width="1.6" />
    <rect width="650" height="24" rx="6" fill="#92400E" />
    <text x="10" y="16" fill="#FEF3C7" font-size="12" font-weight="bold">I3CBus  (Electrical Wire &amp; Event Mediator)</text>
    <text x="10" y="42" fill="#E2E8F0" font-size="10.5">• Resolves shared SCL/SDA: Open-Drain Wired-AND (Rp pull-up) vs Push-Pull</text>
    <text x="10" y="58" fill="#94A3B8" font-size="10">• Holds List&lt;IBusDevice&gt;; dispatches Start/Sr/Stop/ClockEdges/IdleTime to all attached devices</text>
    <text x="10" y="72" fill="#FCD34D" font-size="9.5">Emits BusSample → BusWaveformRecorder; notifies SimulationStepGate</text>
  </g>

  <!-- Timing -->
  <g transform="translate(734, 494)">
    <rect width="342" height="78" rx="6" fill="#1E293B" stroke="#F59E0B" stroke-width="1.3" />
    <rect width="342" height="24" rx="6" fill="#78350F" />
    <text x="10" y="16" fill="#FEF3C7" font-size="12" font-weight="bold">Timing  (ClockProfile &amp; Constants)</text>
    <text x="10" y="42" fill="#E2E8F0" font-size="10">• I3CPushPull (12.5MHz, 40ns), I3COpenDrain</text>
    <text x="10" y="56" fill="#94A3B8" font-size="10">• I3CFirstBroadcast (200ns), I2CFastMode (600ns)</text>
    <text x="10" y="70" fill="#94A3B8" font-size="10">• SpikeFilterNs=50, BusAvailableNs=1µs, BusIdleNs=200µs</text>
  </g>

  <!-- ==================== LAYER 4: PROTOCOL ==================== -->
  <rect x="24" y="608" width="1072" height="128" rx="8" fill="#0F172A" stroke="#6366F1" stroke-width="1.2" />
  <text x="38" y="628" fill="#A5B4FC" font-size="12" font-weight="bold">PROTOCOL LAYER  (I3CEmulator.Core / Protocol — Pure Value Types &amp; Helpers)</text>

  <!-- CccCode -->
  <g transform="translate(44, 642)">
    <rect width="236" height="78" rx="6" fill="#1E293B" stroke="#818CF8" stroke-width="1.2" />
    <rect width="236" height="22" rx="6" fill="#312E81" />
    <text x="10" y="15" fill="#E0E7FF" font-size="11.5" font-weight="bold">CccCode</text>
    <text x="10" y="40" fill="#CBD5E1" font-size="10">• Broadcast (0x00..0x7F)</text>
    <text x="10" y="54" fill="#94A3B8" font-size="10">• Direct (0x80..0xFE)</text>
    <text x="10" y="68" fill="#94A3B8" font-size="10">• TargetEventMask</text>
  </g>

  <!-- DeviceRegisters -->
  <g transform="translate(304, 642)">
    <rect width="256" height="78" rx="6" fill="#1E293B" stroke="#818CF8" stroke-width="1.2" />
    <rect width="256" height="22" rx="6" fill="#312E81" />
    <text x="10" y="15" fill="#E0E7FF" font-size="11.5" font-weight="bold">DeviceRegisters</text>
    <text x="10" y="40" fill="#CBD5E1" font-size="10">• TargetIdentity (PID/BCR/DCR)</text>
    <text x="10" y="54" fill="#94A3B8" font-size="10">• BcrFlags, DcrCategory</text>
    <text x="10" y="68" fill="#94A3B8" font-size="10">• LegacyI2CDeviceDescriptor</text>
  </g>

  <!-- I3CAddresses -->
  <g transform="translate(584, 642)">
    <rect width="236" height="78" rx="6" fill="#1E293B" stroke="#818CF8" stroke-width="1.2" />
    <rect width="236" height="22" rx="6" fill="#312E81" />
    <text x="10" y="15" fill="#E0E7FF" font-size="11.5" font-weight="bold">I3CAddresses</text>
    <text x="10" y="40" fill="#CBD5E1" font-size="10">• Broadcast = 0x7E</text>
    <text x="10" y="54" fill="#94A3B8" font-size="10">• HotJoin = 0x02</text>
    <text x="10" y="68" fill="#94A3B8" font-size="10">• PackHeader / IsValidDA</text>
  </g>

  <!-- Parity -->
  <g transform="translate(844, 642)">
    <rect width="232" height="78" rx="6" fill="#1E293B" stroke="#818CF8" stroke-width="1.2" />
    <rect width="232" height="22" rx="6" fill="#312E81" />
    <text x="10" y="15" fill="#E0E7FF" font-size="11.5" font-weight="bold">Parity</text>
    <text x="10" y="40" fill="#CBD5E1" font-size="10">• ComputeOddParityTBit()</text>
    <text x="10" y="54" fill="#94A3B8" font-size="10">• VerifyOddParityTBit()</text>
    <text x="10" y="68" fill="#94A3B8" font-size="10">• 9th T-Bit SDR Write check</text>
  </g>

  <!-- ==================== DEPENDENCY ARROWS ==================== -->

  <!-- Simulation internal -->
  <line x1="354" y1="155" x2="404" y2="155" stroke="#38BDF8" stroke-width="1.6" marker-end="url(#arrow-own)" />
  <path d="M 354 130 L 380 130 L 380 98 L 760 98 L 760 108" fill="none" stroke="#38BDF8" stroke-width="1.6" marker-end="url(#arrow-own)" />
  <line x1="863" y1="155" x2="894" y2="155" stroke="#F59E0B" stroke-width="1.6" marker-end="url(#arrow-data)" />

  <!-- Scenario -> Devices (owns/drives) -->
  <line x1="160" y1="202" x2="160" y2="336" stroke="#38BDF8" stroke-width="1.6" marker-end="url(#arrow-own)" />
  <path d="M 240 202 L 240 230 L 573 230 L 573 266" fill="none" stroke="#38BDF8" stroke-width="1.4" opacity="0.7" />
  <path d="M 573 230 L 920 230 L 920 336" fill="none" stroke="#38BDF8" stroke-width="1.4" marker-end="url(#arrow-own)" />

  <!-- Implements IBusDevice -->
  <path d="M 214 336 L 214 295 L 415 295" fill="none" stroke="#34D399" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arrow-impl)" />
  <line x1="560" y1="336" x2="560" y2="318" stroke="#34D399" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arrow-impl)" />
  <path d="M 918 336 L 918 295 L 705 295" fill="none" stroke="#34D399" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arrow-impl)" />

  <!-- Devices <-> I3CBus -->
  <line x1="214" y1="424" x2="214" y2="494" stroke="#38BDF8" stroke-width="1.6" marker-end="url(#arrow-own)" />
  <line x1="560" y1="424" x2="560" y2="494" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow-dep)" />
  <path d="M 860 424 L 860 448 L 640 448 L 640 494" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow-dep)" />

  <!-- I3CBus -> Timing -->
  <line x1="694" y1="533" x2="734" y2="533" stroke="#64748B" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow-dep)" />

  <!-- I3CBus -> BusWaveformRecorder (emits samples, routed on right margin) -->
  <path d="M 650 494 L 650 472 L 748 472 L 748 202" fill="none" stroke="#F59E0B" stroke-width="1.6" marker-end="url(#arrow-data)" />

  <!-- Devices & Bus -> Protocol layer (summary dependency arrows) -->
  <line x1="162" y1="572" x2="162" y2="642" stroke="#64748B" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#arrow-dep)" />
  <line x1="432" y1="572" x2="432" y2="642" stroke="#64748B" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#arrow-dep)" />
  <line x1="660" y1="572" x2="660" y2="642" stroke="#64748B" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#arrow-dep)" />
  <line x1="940" y1="572" x2="940" y2="642" stroke="#64748B" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#arrow-dep)" />
</svg>
